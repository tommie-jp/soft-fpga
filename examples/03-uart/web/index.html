<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>03-uart — rtlscope</title>
  <style>
    body { background:#1a1a1a; color:#eee; font-family:monospace; margin:20px; }
    h2   { margin:0 0 10px; font-size:16px; color:#aaa; }
    .controls { display:flex; align-items:center; gap:14px; margin-bottom:8px; flex-wrap:wrap; }
    button { background:#2a2a2a; color:#eee; border:1px solid #555; padding:4px 14px; cursor:pointer; }
    button:hover { background:#3a3a3a; }
    label { font-size:12px; color:#aaa; }
    #cycle-info { font-size:12px; color:#666; }
    canvas { display:block; border:1px solid #333; max-width:100%; height:auto; }
    .send-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
    #send-input {
      background:#111; color:#0f0; border:1px solid #444;
      font-family:monospace; font-size:13px; padding:3px 8px; width:240px; max-width:100%; box-sizing:border-box;
    }
    #btn-send { border-color:#00c853; color:#00c853; }
    #btn-send:hover { background:#003a1a; }
    .bottom-row { display:flex; gap:12px; align-items:flex-start; margin-top:8px; flex-wrap:wrap; }
    @media (max-width:500px) { body { margin:12px; } }
    #reg-panel {
      border:1px solid #333; padding:10px 16px;
      font-size:13px; line-height:2; color:#ccc; min-width:180px;
    }
    #reg-panel .val   { color:#eee; }
    #reg-panel .label { color:#666; }
    #rx-history {
      border:1px solid #333; padding:8px 12px;
      font-size:12px; min-width:140px; max-height:160px;
      overflow-y:auto; line-height:1.6; color:#aaa;
    }
    #rx-history .title { color:#666; margin-bottom:4px; }
    #rx-history .byte  { color:#88ccff; }
  </style>
</head>
<body>
<script src="js/sft-book-header.js" data-page="03-uart"></script>
  <h2>03-uart (loopback)</h2>
  <div class="controls">
    <button id="btn-run">Run</button>
    <button id="btn-reset">Reset</button>
    <label>速度: <input id="speed" type="range" min="1" max="500" value="60"></label>
    <span id="cycle-info">0 cycles</span>
  </div>
  <div class="send-row">
    <input id="send-input" type="text" placeholder='送信文字列 (例: Hello)' maxlength="32">
    <button id="btn-send">Send</button>
    <span style="font-size:11px;color:#555;">または Enter キー</span>
  </div>

  <!-- Logic Analyzer（js/rtlscope-la.js: 06-8080 と同じ UI） -->
  <div id="la-root"></div>

  <div class="bottom-row">
    <!-- Register Panel -->
    <div id="reg-panel">
      <div><span class="label">TX Data : </span><span class="val" id="r-txdata">-</span></div>
      <div><span class="label">RX Data : </span><span class="val" id="r-rxdata">-</span></div>
      <div><span class="label">TX State: </span><span class="val" id="r-txstate">-</span></div>
      <div><span class="label">RX State: </span><span class="val" id="r-rxstate">-</span></div>
      <div><span class="label">tx_ready: </span><span class="val" id="r-txrdy">-</span></div>
      <div><span class="label">rx_error: </span><span class="val" id="r-rxerr">-</span></div>
    </div>
    <!-- 受信履歴 -->
    <div id="rx-history">
      <div class="title">受信履歴</div>
    </div>
  </div>

  <p id="copyright" style="font-size:12px;color:#555;margin:6px 0 0;">&copy; 2026 <a href="https://github.com/tommie-jp" target="_blank" rel="noopener" style="color:#666;">tommie.jp</a>
  &nbsp;&mdash;&nbsp;
  <a href="03-uart-QR.png" target="_blank" rel="noopener" style="color:#666;">QR</a>
  </p>

  <script src="js/sft-uart-la-defs.js"></script>
  <script src="js/rtlscope-la.js"></script>
  <script src="js/sft-la-toolbar.js"></script>
  <script src="js/sft-la-ctrl.js"></script>
  <script src="js/sft-la-glue.js"></script>
  <script>
  // シミュレーション本体は Web Worker（sim-worker.js）で回す。このスクリプトは UI と描画だけを持つ。
  // UART_STATE_NAMES は js/sft-uart-la-defs.js で定義する

  const BIT_TX_READY = 3;
  const BIT_RX_ERROR = 5;
  const BIT_TX_STATE = 6;
  const BIT_RX_STATE = 8;
  const BIT_TX_DATA  = 16;
  const BIT_RX_DATA  = 24;

  const $ = id => document.getElementById(id);
  const fmtByte = v => '0x' + v.toString(16).toUpperCase().padStart(2, '0') +
                       (v >= 0x20 && v < 0x7F ? " '" + String.fromCharCode(v) + "'" : '');

  let onFrame         = null;   // boot() が設定する
  let onWorkerStopped = null;
  let epoch           = 0;      // Reset のたびに増やす。古いフレームを捨てる目印
  const RX_HISTORY_MAX = 200;   // 受信履歴の行数の上限（走らせっぱなしでも DOM を増やさない）
  const worker = openLaWorker('sim-worker.js', {
    onReady: function (m) { boot(m.ringSize, m.ringWords); },
    onFrame: function (m) { if (onFrame) onFrame(m); },
    onFault: function (text) {
      $('cycle-info').textContent = text;
      if (onWorkerStopped) onWorkerStopped();
    }
  });
  function send(msg) { worker.postMessage(msg); }

  function boot(ringSize, ringWords) {
    let running    = false;
    let latest     = null;    // 直近の frame（描画用）
    let rafPending = false;
    const rxHistory = $('rx-history');

    function setRunning(on) {
      running = on;
      $('btn-run').textContent = running ? 'Pause' : 'Run';
    }
    function applySteps() {
      send({ type: 'setSteps', steps: parseInt($('speed').value, 10) });
    }
    function startRun() {
      applySteps();
      setRunning(true);
      send({ type: 'setRunning', running: true });   // トリガー停止後は Worker が Thaw して再武装する
    }

    const lag = setupLaWorker({
      worker: worker, ringSize: ringSize, ringWords: ringWords,
      rootId: 'la-root',
      config: UART_LA_CONFIG, signals: UART_LA_SIGNALS,
      zoomIdx: 2,   // 1x: 1 フレーム（160 クロック）が 160px で、バイト表示が読める
      onArm: startRun
    });

    onWorkerStopped = function () { setRunning(false); };

    function render() {
      rafPending = false;
      if (!latest) return;

      // Logic Analyzer（描画と最新サンプルの取得）
      const head   = lag.draw();
      const sample = lag.latestWord(0);

      // Register Panel
      if (head > 0) {
        $('r-txdata').textContent  = fmtByte((sample >> BIT_TX_DATA) & 0xFF);
        $('r-rxdata').textContent  = fmtByte((sample >> BIT_RX_DATA) & 0xFF);
        $('r-txstate').textContent = UART_STATE_NAMES[(sample >> BIT_TX_STATE) & 0x3];
        $('r-rxstate').textContent = UART_STATE_NAMES[(sample >> BIT_RX_STATE) & 0x3];
        $('r-txrdy').textContent   = (sample >> BIT_TX_READY) & 0x1;
        $('r-rxerr').textContent   = ((sample >> BIT_RX_ERROR) & 0x1) ? '⚠ ERROR' : '0';
      }
      $('cycle-info').textContent = head + ' cycles';
    }

    onFrame = function (m) {
      if (m.epoch !== epoch) return;   // Reset より前に作られたフレームは捨てる
      lag.frame(m);
      latest = m;

      // 受信履歴（Worker が前のフレームから増えた分を m.rx で渡す。1 回の描画の間に何字届いてもよい）
      if (m.rx.length > 0) {
        for (const b of m.rx) {
          const line = document.createElement('div');
          line.className = 'byte';
          line.textContent = '> ' + fmtByte(b);
          rxHistory.appendChild(line);
        }
        while (rxHistory.querySelectorAll('.byte').length > RX_HISTORY_MAX) {
          rxHistory.querySelector('.byte').remove();   // 古い順に捨てる（先頭の .title は残る）
        }
        rxHistory.scrollTop = rxHistory.scrollHeight;
      }

      if (m.trigPause && running) setRunning(false);   // トリガー停止

      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(render);
      }
    };

    function sendString(s) {
      for (let i = 0; i < s.length; i++) send({ type: 'sendByte', b: s.charCodeAt(i) });
    }

    $('speed').addEventListener('input', applySteps);

    $('btn-run').addEventListener('click', function () {
      if (running) {
        setRunning(false);
        send({ type: 'setRunning', running: false });
      } else {
        startRun();
      }
    });

    $('btn-reset').addEventListener('click', function () {
      epoch++;
      send({ type: 'reset', epoch: epoch });
      setRunning(false);
      // 履歴は残す（意図的）
    });

    $('btn-send').addEventListener('click', function () {
      const s = $('send-input').value;
      if (s.length > 0) sendString(s);
    });

    $('send-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        const s = this.value;
        if (s.length > 0) sendString(s);
      }
    });

    applySteps();
  }
  </script>
</body>
</html>
