<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>01-counter — rtlscope</title>
  <style>
    body { background: #fff; color: #111; font-family: monospace; margin: 20px; }
    h2   { margin: 0 0 12px; font-size: 16px; color: #333; }
    .controls { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; flex-wrap: wrap; }
    button {
      background: #e8e8e8; color: #222;
      border: 1px solid #aaa; padding: 3px 12px; cursor: pointer;
      font-family: monospace; font-size: 13px;
    }
    button:hover { background: #d0d0d0; }
    label { font-size: 12px; color: #555; }
    #cycle-info { font-size: 12px; color: #666; }
    #error-box { display: none; color: #cc3333; font-size: 13px; margin: 8px 0; white-space: pre-wrap; }
    @media (max-width:500px) { body { margin: 12px; } }
  </style>
</head>
<body>
<script src="js/sft-book-header.js" data-page="01-counter"></script>
  <h2>01-counter</h2>
  <div class="controls">
    <button id="btn-run">Run</button>
    <button id="btn-reset">Reset</button>
    <label>速度: <input id="speed" type="range" min="1" max="2000" value="200"></label>
    <span id="cycle-info">0 cycles</span>
  </div>
  <div id="error-box"></div>

  <!-- Logic Analyzer（js/rtlscope-la.js + js/sft-la-toolbar.js: 06-8080 と同じ UI） -->
  <div id="la-root"></div>

  <script>
  function showError(e) {
    console.error('[01-counter]', e);
    var box = document.getElementById('error-box');
    box.style.display = 'block';
    box.textContent = '初期化に失敗しました: ' + (e && e.message ? e.message : e);
  }

  var Module = {
    onRuntimeInitialized: function () {
      try {
        start();
      } catch (e) {
        showError(e);
      }
    }
  };

  function start() {
    Module._sim_init();
    var running  = false;
    var btnRun   = document.getElementById('btn-run');
    var speedEl  = document.getElementById('speed');
    var cycleEl  = document.getElementById('cycle-info');

    function setRunning(on) {
      running = on;
      btnRun.textContent = running ? 'Pause' : 'Run';
    }

    var lag = setupLa({
      Module: Module, rootId: 'la-root',
      config: COUNTER_LA_CONFIG, signals: COUNTER_LA_SIGNALS,
      zoomIdx: 5,  // 8x: b0 の周期と count の値が読める倍率で開始する
      onArm: function () { setRunning(true); }
    });

    function loop() {
      try {
        if (running) {
          Module._sim_run_n(parseInt(speedEl.value, 10));
          if (lag.triggerHit()) setRunning(false);  // トリガー停止
        }
        cycleEl.textContent = lag.draw() + ' cycles';
      } catch (e) {
        showError(e);
        return;  // エラー時は再スケジュールしない
      }
      requestAnimationFrame(loop);
    }

    btnRun.addEventListener('click', function () {
      if (!running) lag.resume();   // トリガー停止後は Thaw して再武装する
      setRunning(!running);
    });
    document.getElementById('btn-reset').addEventListener('click', function () {
      Module._reset_sim();
      setRunning(false);
    });

    requestAnimationFrame(loop);
  }
  </script>

  <script src="js/rtlscope-la.js"></script>
  <script src="js/sft-la-toolbar.js"></script>
  <script src="js/sft-la-ctrl.js"></script>
  <script src="js/sft-la-glue.js"></script>
  <script src="sim.js"></script>
</body>
</html>
