name: sfa

x-base: &base
  image: sfa-dev:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}
  volumes:
    - ../:/work
    - sfa-ccache:/ccache
  working_dir: /work
  environment:
    - CCACHE_DIR=/ccache

x-pico: &pico
  # Pico 2 ファームウェア用イメージ (Dockerfile.pico)
  image: sfa-pico:local
  build:
    context: .
    dockerfile: Dockerfile.pico
    args:
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}
  volumes:
    - ../:/work
    - sfa-ccache:/ccache
  working_dir: /work
  environment:
    - CCACHE_DIR=/ccache

services:
  dev:
    <<: *base
    tty: true
    stdin_open: true
    command: ["bash"]

  firmware:
    # Pico 2 ファームウェアのビルド。scripts/build-pico.sh から呼ぶ。
    <<: *pico
    command: ["bash", "-lc", "scripts/_build-pico-inner.sh"]

  flash:
    # Debug Probe (CMSIS-DAP) 経由で ELF を書き込む。scripts/flash.sh から呼ぶ。
    <<: *pico
    user: "0"
    devices:
      - /dev/bus/usb:/dev/bus/usb
    command: ["bash", "-lc", "scripts/_flash-inner.sh ${ELF:-firmware/build/apple1_hello.elf}"]

  test-hil:
    # 実機 (Pico 2 + Debug Probe) に対する pytest。scripts/test-hil.sh から呼ぶ。
    <<: *pico
    user: "0"
    # /dev をバインドする理由:
    #   - openocd は /dev/bus/usb 経由で Probe (CMSIS-DAP) を叩く
    #   - pyserial は /dev/ttyACM0 を開く。フラッシュ後の Pico 再列挙で
    #     ttyACM の minor 番号が変わるため、static な devices: ではなく
    #     /dev 全体をバインドして live に追従させる
    privileged: true
    volumes:
      - ../:/work
      - sfa-ccache:/ccache
      - sfa-hil-venv:/opt/hil-venv
      - /dev:/dev
    environment:
      - CCACHE_DIR=/ccache
      - SFA_IN_CONTAINER=1
      - PIP_CACHE_DIR=/ccache/pip
    command: ["scripts/_test-hil-inner.sh"]

  build-sim:
    # examples/<EXAMPLE> をネイティブ Linux バイナリ (build/sim) にビルドする。
    # scripts/build-sim.sh から EXAMPLE 環境変数で呼び出す。
    <<: *base
    init: true
    entrypoint: ["scripts/_build-sim-inner.sh"]
    command: []

  dormann:
    # Klaus Dormann 6502 機能テストをネイティブで実行する。
    <<: *base
    command: ["bash", "-c", "verif/dormann/run.sh"]

  wozmon:
    # Woz Monitor インテグレーションテストをネイティブで実行する。
    <<: *base
    command: ["bash", "-c", "verif/wozmon/run.sh"]

  test-cocotb:
    # cocotb + pytest による RTL 単体回帰テスト。
    # scripts/test-cocotb.sh または直接 docker compose run test-cocotb で実行。
    <<: *base
    entrypoint: ["scripts/_test-cocotb-inner.sh"]
    command: []

  test-8080-cpm:
    # 8080 CP/M シミュレータ cmake ビルド＋全テスト。
    # doTestAll.sh [05] から呼び出される。
    # 内容: RTL lint / --test / --run-test / --boot-test / --exec 8080EX1 / --ddt-ctrlc-test
    <<: *base
    init: true
    entrypoint: ["scripts/_test-8080-cpm-inner.sh"]
    command: []

  build-wasm:
    # WASM ビルド (Verilator + Emscripten)。
    # scripts/build-wasm-06.sh などを直接呼び出す。
    image: sfa-dev-wasm:local
    build:
      context: .
      dockerfile: Dockerfile.wasm
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    volumes:
      - ../:/work
      - sfa-ccache:/ccache
    working_dir: /work
    init: true
    entrypoint: ["bash", "-c"]
    command: ["scripts/build-wasm-06.sh"]

volumes:
  sfa-ccache:
  sfa-hil-venv:
